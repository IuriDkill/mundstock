<html lang="pt-BR">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iuri Mundstock — Desenvolvedor de Software</title>

    <meta property="og:title" content="Iuri Mundstock" />
    <meta property="og:description" content="Desenvolvedor de software · Full-stack · Cibersegurança" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default look.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
